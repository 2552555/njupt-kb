# 开发环境：PostgreSQL + Redis + MinIO(S3) + API + Celery worker/beat + Web
# 启动: docker compose up -d
# 首次启动后执行迁移与种子:
#   docker compose exec api alembic upgrade head
#   docker compose exec api python -m scripts.seed
# ClamAV 体积较大，默认不启动；需要验证真实扫描时: docker compose --profile scan up -d

name: njupt-kb

x-backend-env: &backend-env
  ENV: dev
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-njupt}:${POSTGRES_PASSWORD:-njupt}@postgres:5432/${POSTGRES_DB:-njupt_kb}
  REDIS_URL: redis://redis:6379/0
  SECRET_KEY: ${SECRET_KEY:-dev-only-secret-not-for-production-use}
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-njupt}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-njupt-dev-secret}
  S3_BUCKET_QUARANTINE: njupt-quarantine
  S3_BUCKET_PRIVATE: njupt-private
  S3_FORCE_PATH_STYLE: "true"
  CORS_ORIGINS: '["http://localhost:3000"]'
  PUBLIC_BASE_URL: http://localhost:3000
  COOKIE_SECURE: "false"
  CLAMD_HOST: clamav
  MAIL_ENABLED: "false"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-njupt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-njupt}
      POSTGRES_DB: ${POSTGRES_DB:-njupt_kb}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-njupt} -d ${POSTGRES_DB:-njupt_kb}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-njupt}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-njupt-dev-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-njupt} ${MINIO_ROOT_PASSWORD:-njupt-dev-secret} &&
      mc mb --ignore-existing local/njupt-quarantine &&
      mc mb --ignore-existing local/njupt-private &&
      mc anonymous set none local/njupt-quarantine &&
      mc anonymous set none local/njupt-private
      "
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      <<: *backend-env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.workers.celery_app:celery_app worker -Q njupt -l info --concurrency=2
    environment:
      <<: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.workers.celery_app:celery_app beat -l info
    environment:
      <<: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      NEXT_PUBLIC_API_BASE: http://api:8000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    restart: unless-stopped

  clamav:
    image: clamav/clamav:stable
    profiles: ["scan"]
    ports:
      - "3310:3310"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
