# 生产环境：一个 Web、一个 API、一个 Worker、PostgreSQL、Redis 与私有对象存储（设计文档 §31.1）
# 迁移在发布步骤执行一次，不由多个 API 实例并发自动迁移。
# 使用方式: cp .env.production .env && docker compose -f docker-compose.prod.yml up -d

name: njupt-kb

x-backend-env: &backend-env
  ENV: prod
  DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
  REDIS_URL: redis://redis:6379/0
  SECRET_KEY: ${SECRET_KEY}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
  CORS_ORIGINS: ${CORS_ORIGINS}
  COOKIE_SECURE: "true"
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  S3_BUCKET_QUARANTINE: ${S3_BUCKET_QUARANTINE:-njupt-quarantine}
  S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE:-njupt-private}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  SCANNER: ${SCANNER:-clamav}
  CLAMD_HOST: ${CLAMD_HOST:-clamav}
  MAIL_ENABLED: ${MAIL_ENABLED:-true}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME}
  SMTP_PASSWORD: ${SMTP_PASSWORD}
  MAIL_FROM: ${MAIL_FROM}
  COMMERCE_ENABLED: ${COMMERCE_ENABLED:-false}
  AI_ENABLED: ${AI_ENABLED:-false}
  AI_BASE_URL: ${AI_BASE_URL:-}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: always

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: always

  # 自建对象存储时启用；使用托管对象存储服务可移除本服务与 depends_on。
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - miniodata:/data
    restart: always

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --proxy-headers
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    command: celery -A app.workers.celery_app:celery_app worker -Q njupt -l info --concurrency=4
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.workers.celery_app:celery_app beat -l info
    environment:
      <<: *backend-env
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  clamav:
    image: clamav/clamav:stable
    environment:
      CLAMAV_NO_MILTERD: "true"
    restart: always

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_BASE_URL}
    environment:
      NEXT_PUBLIC_API_BASE: http://api:8000
      NEXT_PUBLIC_SITE_URL: ${PUBLIC_BASE_URL}
    depends_on:
      - api
    restart: always

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - web
    restart: always

volumes:
  pgdata:
  redisdata:
  miniodata:
